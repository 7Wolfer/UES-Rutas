# Publica la versión web de UES Rutas en GitHub Pages cada vez que se sube
# algo a main (y a mano desde la pestaña Actions). Antes de publicar corre el
# análisis estático y todas las pruebas: si algo falla, no se publica.
name: Publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      # Dirección del sitio: con dominio propio la base es "/", sin él
      # "/UES-Rutas/". Pages la informa aquí.
      - id: pages
        uses: actions/configure-pages@v5

      - run: flutter pub get
      - run: dart analyze
      - run: flutter test

      - name: Compilar
        run: >
          flutter build web --release
          --base-href "${{ steps.pages.outputs.base_path }}/"
          --dart-define=URL_PUBLICA=${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
