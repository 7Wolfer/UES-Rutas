name: ues_rutas
description: >
  UES Rutas — aplicación de orientación y navegación para el campus de la
  Universidad Estatal de Sonora (plantel Hermosillo).
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado
  flutter_riverpod: ^2.6.1

  # Navegación
  go_router: ^14.6.0

  # Backend / auth (stub por ahora, detrás de feature flag)
  supabase_flutter: ^2.8.0

  # Mapa real (OpenStreetMap) + capa del campus
  flutter_map: 7.0.2
  latlong2: ^0.9.1

  # Calendario académico
  table_calendar: ^3.1.2

  # Notificaciones locales
  flutter_local_notifications: ^18.0.1

  # Ubicación del usuario
  geolocator: ^13.0.2

  # Abrir WhatsApp / teléfono
  url_launcher: ^6.3.1

  # Credencial digital (QR)
  qr_flutter: ^4.1.0

  # Marca UES (llama)
  flutter_svg: ^2.0.16

  # Persistencia de ajustes
  shared_preferences: ^2.3.0

  # Utilidades
  collection: ^1.19.0
  intl: ^0.20.2
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.3
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/seed/
    - assets/brand/
    - assets/docs/
    - assets/tiles/

  # Identidad UES: Montserrat (títulos) + Source Sans 3 (cuerpo).
  # Empaquetadas para no descargarlas en runtime (arranque más rápido, sin FOUT).
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
    - family: Source Sans 3
      fonts:
        - asset: assets/fonts/SourceSans3-Regular.ttf
        - asset: assets/fonts/SourceSans3-Medium.ttf
          weight: 500
        - asset: assets/fonts/SourceSans3-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SourceSans3-Bold.ttf
          weight: 700

flutter_native_splash:
  color: "#FDFCFB"
  color_dark: "#17130F"
  image: assets/brand/splash.png
  image_dark: assets/brand/splash_dark.png
  android_12:
    color: "#FDFCFB"
    color_dark: "#17130F"
    image: assets/brand/splash.png
    image_dark: assets/brand/splash_dark.png
  web: false

# Íconos de la app. Regenerar con: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/brand/icono_app.png"
  android: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/brand/icono_adaptivo_fg.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/brand/icono_web.png"
    background_color: "#FFFFFF"
    theme_color: "#8E1537"
